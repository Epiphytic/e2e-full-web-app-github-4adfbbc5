[package]
name = "sqlite-editor"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-files = "0.6"
actix-rt = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
jsonwebtoken = "9"
tera = "1"
base64 = "0.22"
rsa = { version = "0.9", features = ["pem"] }
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
env_logger = "0.11"
log = "0.4"
regex = "1"

[dev-dependencies]
actix-web = { version = "4", features = ["macros"] }
tempfile = "3"
