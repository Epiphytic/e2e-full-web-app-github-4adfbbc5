{% extends "base.html" %}
{% block title %}Dashboard - SQLite Editor{% endblock %}
{% block content %}
<h2>Database Tables</h2>
<div id="create-table-form">
    <input type="text" name="table_name" placeholder="New table name..."
           pattern="[a-zA-Z_][a-zA-Z0-9_]*" required
           id="new-table-name">
    <button hx-post="/api/tables"
            hx-include="#new-table-name"
            hx-target="#table-list"
            hx-swap="innerHTML"
            hx-on::after-request="if(event.detail.successful) document.getElementById('new-table-name').value=''">
        Create Table
    </button>
</div>
<div id="table-list"
     hx-get="/api/tables"
     hx-trigger="load"
     hx-swap="innerHTML">
    Loading...
</div>
{% endblock %}
